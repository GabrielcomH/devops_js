name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. Pipeline Init & Build
  build-and-test:
    name: Pipeline Init & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar sintaxe e função calcular
        run: |
          node --check app.js
          node -e "const { calcular } = require('./app.js'); if (calcular('+', 10, 5) !== 15) process.exit(1);"

  # 2. Nó de SAST (Static Application Security Testing - Semgrep)
  sast-scan:
    name: SAST Scan (Semgrep)
    needs: build-and-test
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar análise estática SAST com Semgrep
        run: semgrep scan --config auto --error app.js

  # 3. Nó de DAST (Dynamic Application Security Testing - OWASP ZAP)
  dast-scan:
    name: DAST Scan (OWASP ZAP)
    needs: sast-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Iniciar servidor da aplicação
        run: |
          node app.js &
          sleep 3

      - name: Executar análise dinâmica DAST com OWASP ZAP
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:3000'
          fail_action: true
          allow_issue_writing: false

  # 4. Nó de Deploy
  deploy:
    name: Deploy
    needs: dast-scan
    runs-on: ubuntu-latest
    steps:
      - name: Executar Deploy
        run: echo "Deploy concluído com sucesso após aprovação nos testes SAST e DAST!"