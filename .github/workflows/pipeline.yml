name: CI Pipeline Node.js

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Executar o programa
      run: |
        node app.js